  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body>

  <!-- Sticky Navbar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="index.html" class="brand-logo">
        <img src="assets/logo.png" alt="Decode AI Logo" class="logo-img js-logo-img">
        <div>
          <span class="brand-text">DECODE AI</span>
          <span class="brand-tagline-sub">LEARN AI. BUILD FUTURE.</span>
        </div>
      </a>

      <nav>
        <ul id="nav-menu" class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="resources.html" class="nav-link active">Resources</a></li>
          <li><a href="roadmaps.html" class="nav-link">Roadmaps</a></li>
          <li><a href="notes.html" class="nav-link">Notes</a></li>
          <li><a href="community.html" class="nav-link">Community</a></li>
          <li><a href="contribute.html" class="nav-link">Contribute</a></li>
          <li><a href="about.html" class="nav-link">About</a></li>
        </ul>
      </nav>

      <div class="nav-actions">
        <button class="btn-search-trigger js-open-search" aria-label="Search Knowledge Base">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <span>Search</span>
          <span class="kbd-shortcut">⌘K</span>
        </button>

        <button class="btn-icon js-theme-toggle" aria-label="Toggle Theme">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle></svg>
        </button>

        <button id="mobile-menu-toggle" class="mobile-toggle" aria-label="Toggle Navigation Menu">☰</button>
      </div>
    </div>
  </header>

  <!-- Reader Container -->
  <main class="section">
    <div class="container" id="resource-detail-container">
      <div style="text-align: center; padding: 4rem 0;" class="text-muted">
        Loading study guide...
      </div>
    </div>
  </main>

  <!-- Footer -->
  <footer class="footer">
    <div class="container">
      <div class="footer-bottom">
        <div>© 2026 DECODE AI. Built by learners, for learners. Open Knowledge.</div>
        <div class="social-links">
          <a href="https://github.com/decodeai/decodeai-community" target="_blank" aria-label="GitHub">GitHub</a>
          <a href="https://linkedin.com/company/decode-ai-community" target="_blank" aria-label="LinkedIn">LinkedIn</a>
        </div>
      </div>
    </div>

  <script src="js/theme.js"></script>
  <script src="js/search.js"></script>
  <script src="js/resources.js"></script>
  <script src="js/app.js"></script>
