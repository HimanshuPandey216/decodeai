<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" width="400" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="#070B12" rx="16"/>
  <!-- Neural Icon -->
  <g transform="translate(20, 20)">
    <circle cx="30" cy="30" r="24" fill="url(#logoGrad)" filter="url(#glow)"/>
    <path d="M20 35 L30 20 L40 35 L30 30 Z" fill="#070B12"/>
    <circle cx="30" cy="20" r="3" fill="#FFFFFF"/>
    <circle cx="20" cy="35" r="3" fill="#FFFFFF"/>
    <circle cx="40" cy="35" r="3" fill="#FFFFFF"/>
  </g>
  <!-- Text -->
  <text x="95" y="52" font-family="'Inter', sans-serif" font-weight="900" font-size="32" fill="#FFFFFF" letter-spacing="1">DECODE <tspan fill="#00F0FF">AI</tspan></text>
  <text x="96" y="72" font-family="'Inter', sans-serif" font-weight="600" font-size="12" fill="#00F0FF" letter-spacing="3">LEARN AI. BUILD FUTURE.</text>
</svg>
